<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>

<body>

 

    <form id="myForm">

        <label for="name">Username</label>
        <input type="text" id="name" placeholder="Enter name" minlength="3">
        <br>
        <p id="errorusername"></p>


        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email">
        <br>
        <p id="erroremail"></p>


        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter the password">
        <br>
        <p id="errorpassword"></p>


        <label for="confirmpassword">Confirm Password</label>
        <input type="password" id="confirmpassword" placeholder="Enter confirm password">
        <br>
        <p id="errorconfirmpassword"></p>


        <label for="age">Age</label>
        <input type="number" name="age" id="age" placeholder="Enter the age">
        <br>
        <p id="errorage"></p>


        <label for="city">City</label>
        <select id="city">

            <option value="">Select the city</option>
            <option value="chandigarh">Chandigarh</option>
            <option value="mohali">Mohali</option>
            <option value="abohar">Abohar</option>
            <option value="dhuri">Dhuri</option>
            <option value="ludhiana">Ludhiana</option>

        </select>

        <p id="errorcity"></p>


        <button type="submit">Submit</button>

        <p id="result"></p>

    </form>
